<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>U2-W7-D1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row justify-content-between g-5 mt-5">

            <div class="col-md-6">
                <h1 class="text-center">Owners</h1>

                <form id="owner-form" class="bg-light p-3 rounded">
                    <div class="mb-3">
                        <label for="owner-name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="owner-name" required>
                    </div>

                    <div class="mb-3">
                        <label for="owner-surname" class="form-label">Surname</label>
                        <input type="text" class="form-control" id="owner-surname" required>
                    </div>

                    <div class="mb-3">
                        <label for="owner-age" class="form-label">Age</label>
                        <input type="text" class="form-control" id="owner-age" required>
                    </div>

                    <div class="mb-3">
                        <label for="owner-city" class="form-label">City</label>
                        <input type="text" class="form-control" id="owner-city" required>
                    </div>

                    <button id="saveOwner" type="submit" class="btn btn-primary">Save Owner</button>
                </form>
            </div>

            <div class="col col-md-6">
                <h1 class="text-center">Pets</h1>

                <form id="pet-form" class="bg-light p-3 rounded">
                    <div class="mb-3">
                        <label for="pet-name" class="form-label">Pets Name</label>
                        <input type="text" class="form-control" id="pet-name" required>
                    </div>

                    <div class="mb-3">
                        <label for="pet-owner-name" class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="pet-owner-name" required>
                    </div>

                    <div class="mb-3">
                        <label for="species" class="form-label">Species</label>
                        <input type="text" class="form-control" id="species" required>
                    </div>

                    <div class="mb-3">
                        <label for="breed" class="form-label">Breed</label>
                        <input type="text" class="form-control" id="breed" required>
                    </div>

                    <button id="savePet" type="submit" class="btn btn-primary">Save Pet</button>
                </form>
            </div>
        </div>
    </div>

    <div class="container-fluid mt-5 p-5">
        <div>
            <h4>Owners:</h4>
            <ul id="owners-list">

            </ul>
        </div>
    </div>






    <script src="assets/js/state.js"></script>
    <script src="assets/js/pets.js"></script>
    <script src="assets/js/owners.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
